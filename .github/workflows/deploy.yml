name: Deploy to DigitalOcean Droplet

on:
  push:
    branches:
      - dev
  workflow_dispatch: # Allows you to manually trigger the workflow from GitHub Actions tab

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Lowercase the repository name as Docker tags must be lowercase (e.g., Techxle/Claims-Ui -> techxle/claims-ui)
      - name: Set lowercase repository name
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ui
          file: ./ui/Dockerfile
          push: true
          # Tag looks like: ghcr.io/username/repo-name:latest
          tags: ${{ env.REGISTRY }}/${{ env.REPO }}:latest
          # Pass the secrets securely into the Docker build process
          build-args: |
            VITE_MSAL_CLIENT_ID=${{ secrets.VITE_MSAL_CLIENT_ID }}
            VITE_MSAL_AUTHORITY=${{ secrets.VITE_MSAL_AUTHORITY }}
            VITE_MSAL_REDIRECT_URI=${{ secrets.VITE_MSAL_REDIRECT_URI }}

      - name: Deploy via DigitalOcean API
        run: |
          curl -X POST "https://api.digitalocean.com/v2/droplets/${{ secrets.DROPLET_ID }}/actions" \
            -H "Authorization: Bearer ${{ secrets.DO_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "type": "run_command",
              "command": "
                docker pull ghcr.io/vishal7838/claims-ui:latest &&
                docker stop vite-app || true &&
                docker rm vite-app || true &&
                docker run -d --name vite-app -p 8080:80 --restart unless-stopped ghcr.io/vishal7838/claims-ui:latest
              "
            }'
