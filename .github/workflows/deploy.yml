name: Deploy to DigitalOcean Droplet

on:
  push:
    branches:
      - dev
  workflow_dispatch: # Allows you to manually trigger the workflow from GitHub Actions tab

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Lowercase the repository name as Docker tags must be lowercase (e.g., Techxle/Claims-Ui -> techxle/claims-ui)
      - name: Set lowercase repository name
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ui
          file: ./ui/Dockerfile
          push: true
          # Tag looks like: ghcr.io/username/repo-name:latest
          tags: ${{ env.REGISTRY }}/${{ env.REPO }}:latest
          # Pass the secrets securely into the Docker build process
          build-args: |
            VITE_MSAL_CLIENT_ID=${{ secrets.VITE_MSAL_CLIENT_ID }}
            VITE_MSAL_AUTHORITY=${{ secrets.VITE_MSAL_AUTHORITY }}
            VITE_MSAL_REDIRECT_URI=${{ secrets.VITE_MSAL_REDIRECT_URI }}

      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            # Pull the new image
            docker pull ${{ env.REGISTRY }}/${{ env.REPO }}:latest
            
            # Stop and remove the old container
            docker stop vite-app || true
            docker rm vite-app || true
            
            # Run the new container, mapping Droplet port 80 to Container port 80
            docker run -d --name vite-app -p 8080:80 \
              --restart unless-stopped \
              ${{ env.REGISTRY }}/${{ env.REPO }}:latest
            
            # Clean up old unused images to save disk space
            docker image prune -f
